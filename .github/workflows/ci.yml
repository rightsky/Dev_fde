# 자동 테스트: main 에 올리거나 PR 을 열 때마다 실행된다.
# 1) 백엔드 테스트 (SQLite · PostgreSQL 16)  2) 프런트 타입 검사·빌드  3) Docker 로 전체를 띄워 로그인·백업·복원까지 확인
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde-ci
          POSTGRES_DB: fde_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fde -d fde_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 패키지 설치
        run: pip install -r requirements-dev.txt
      - name: 테스트 (SQLite)
        run: pytest -q
      - name: 테스트 (PostgreSQL 16)
        run: pytest -q
        env:
          FDE_DATABASE_URL: postgresql+psycopg://fde:fde-ci@localhost:5432/fde_test

  frontend:
    name: 프런트 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 타입 검사 + 빌드
        run: npm run build

  docker:
    name: Docker 기동·백업·복원
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: .env 만들기 (CI 전용 임시 값)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "FDE_SECRET_KEY=$(openssl rand -hex 32)"
            echo "FDE_ADMIN_PASSWORD=ci-admin-$(openssl rand -hex 8)"
          } > .env
      - name: 이미지 빌드·기동
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: 화면과 API 응답 확인
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
      - name: 관리자 로그인 확인
        run: |
          pw=$(grep '^FDE_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$pw\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/reference > /dev/null
      - name: 백업 스크립트
        run: ./scripts/backup.sh
      - name: 복원 스크립트
        run: |
          echo yes | ./scripts/restore.sh "$(ls -d backups/* | head -1)"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 2; done
          exit 1
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: 정리
        if: always()
        run: docker compose down -v
