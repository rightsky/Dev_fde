# 개발용 Alembic 설정. 이관 파일 만들기:
#   cd backend && alembic revision --autogenerate -m "무엇을 바꿨는지"
# 접속 주소는 FDE_DATABASE_URL 을 따른다 (app/migrations/env.py). 서버는 기동할 때 자동으로 upgrade head 한다.
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
